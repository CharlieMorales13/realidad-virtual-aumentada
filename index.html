<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Realidad Aumentada - A-Frame + AR.js</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js para A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <script>
      // Anima opacidad y color de los materiales que ya trae el GLB.
      // El color parte del color original del modelo y pasa por la paleta.
      AFRAME.registerComponent("efecto-material", {
        schema: {
          colores: { default: "#ff0055,#00d4ff,#ffe600" },
          opacidadMin: { default: 0.3 },
          duracionOpacidad: { default: 2500 },
          duracionColor: { default: 6000 },
        },

        init() {
          this.materiales = [];
          this.reloj = 0; // tiempo propio: se detiene al pausar y no salta al reanudar
          this.el.addEventListener("model-loaded", () => {
            const vistos = new Set();
            this.el.getObject3D("mesh").traverse((obj) => {
              if (!obj.isMesh) return;
              const lista = Array.isArray(obj.material) ? obj.material : [obj.material];
              const clonados = lista.map((m) => {
                const c = m.clone(); // no modificar materiales compartidos
                c.transparent = true;
                c.depthWrite = false;
                c.needsUpdate = true;
                if (!vistos.has(c.uuid)) {
                  vistos.add(c.uuid);
                  this.materiales.push({ mat: c, original: c.color.clone() });
                }
                return c;
              });
              obj.material = Array.isArray(obj.material) ? clonados : clonados[0];
            });
          });
        },

        tick(_t, dt) {
          if (!this.materiales.length) return;
          this.reloj += dt;
          const t = this.reloj;
          const d = this.data;
          const paleta = d.colores.split(",").map((c) => new THREE.Color(c.trim()));

          // Opacidad: oscila entre 1 y opacidadMin
          const k = 0.5 + 0.5 * Math.cos((2 * Math.PI * t) / d.duracionOpacidad);
          const opacidad = d.opacidadMin + (1 - d.opacidadMin) * k;

          // Color: original -> paleta[0] -> paleta[1] -> ... -> original
          const fase = ((t / d.duracionColor) % 1) * (paleta.length + 1);
          const i = Math.floor(fase);
          const f = fase - i;

          for (const { mat, original } of this.materiales) {
            const pasos = [original, ...paleta];
            mat.color.copy(pasos[i]).lerp(pasos[(i + 1) % pasos.length], f);
            mat.opacity = opacidad;
          }
        },
      });

      // Interacción táctil: tap = pausa/reanuda, pellizco = escala, botones -/pausa/+.
      // Cada acción da retroalimentación: aviso en pantalla, vibración y un beep corto.
      AFRAME.registerComponent("interaccion-tactil", {
        schema: {
          escalaBase: { default: 0.3 },
          escalaMin: { default: 0.1 },
          escalaMax: { default: 1.0 },
          paso: { default: 1.25 },
          musica: { default: "weirdfishes.mp3" },
          volumenMin: { default: 0.1 }, // volumen con el modelo en escalaMin
          volumenMax: { default: 1.0 }, // volumen con el modelo en escalaMax
        },

        init() {
          this.escala = this.data.escalaBase;
          this.pausado = false;
          this.marcadorVisible = false;
          this.audio = null;
          this.ganancia = null; // volumen de la canción, ligado al tamaño
          this.cancion = null;
          this.tween = null;
          this.toastTimer = null;

          this.modelo = this.el; // entidad con el gltf-model
          this.raizAnimada = document.querySelector("#balanceo"); // pausar aquí pausa también a sus hijos
          this.marcador = document.querySelector("a-marker");
          this.toast = document.querySelector("#toast");
          this.chipPausa = document.querySelector("#chip-pausa");
          this.chipTamano = document.querySelector("#chip-tamano");
          this.chipMarcador = document.querySelector("#chip-marcador");
          this.btnMenos = document.querySelector("#btn-menos");
          this.btnMas = document.querySelector("#btn-mas");
          this.btnPausa = document.querySelector("#btn-pausa");

          this.marcador.addEventListener("markerFound", () => {
            this.marcadorVisible = true;
            this.actualizarUI();
            this.avisar("Marcador detectado", "ok");
          });
          this.marcador.addEventListener("markerLost", () => {
            this.marcadorVisible = false;
            this.actualizarUI();
          });

          // Botones
          this.btnMenos.addEventListener("click", () => this.escalarPaso(1 / this.data.paso));
          this.btnMas.addEventListener("click", () => this.escalarPaso(this.data.paso));
          this.btnPausa.addEventListener("click", () => this.alternarPausa());

          // Los navegadores solo dejan iniciar audio tras un gesto del usuario
          const primerGesto = () => this.asegurarMusica();
          document.addEventListener("touchend", primerGesto, { passive: true });
          document.addEventListener("click", primerGesto);

          // Gestos sobre la pantalla
          let inicio = null; // datos del toque de un dedo
          let pellizco = null; // datos del gesto de dos dedos
          let hubo2Dedos = false;
          const enControles = (e) => e.target.closest && e.target.closest("#controles");
          const distancia = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

          document.addEventListener(
            "touchstart",
            (e) => {
              if (enControles(e)) return;
              if (e.touches.length === 1) {
                hubo2Dedos = false;
                inicio = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: performance.now() };
              } else if (e.touches.length === 2) {
                hubo2Dedos = true;
                inicio = null;
                pellizco = { d0: distancia(e.touches), escala0: this.escala };
              }
            },
            { passive: true }
          );

          document.addEventListener(
            "touchmove",
            (e) => {
              if (enControles(e)) return;
              if (e.touches.length === 2 && pellizco) {
                e.preventDefault();
                const nueva = pellizco.escala0 * (distancia(e.touches) / pellizco.d0);
                this.fijarEscala(nueva, { vibrarEnLimite: true });
              } else if (inicio && e.touches.length === 1) {
                const dx = e.touches[0].clientX - inicio.x;
                const dy = e.touches[0].clientY - inicio.y;
                if (Math.hypot(dx, dy) > 12) inicio = null; // se movió: ya no es un tap
              }
            },
            { passive: false }
          );

          document.addEventListener(
            "touchend",
            (e) => {
              if (enControles(e)) return;
              if (pellizco && e.touches.length < 2) {
                pellizco = null;
                this.avisar(this.textoTamano(this.escala), "info");
                this.pulso(20);
              }
              // Tap corto de un solo dedo = pausa/reanuda
              if (inicio && !hubo2Dedos && e.touches.length === 0 && performance.now() - inicio.t < 300) {
                if (!this.marcadorVisible) {
                  this.avisar("Apunta la cámara al marcador", "aviso");
                  this.pulso([30, 40, 30]);
                } else {
                  this.alternarPausa();
                }
              }
              if (e.touches.length === 0) inicio = null;
            },
            { passive: true }
          );

          this.actualizarUI();
        },

        porcentaje() {
          return Math.round((this.escala / this.data.escalaBase) * 100);
        },

        // Volumen (0..1) proporcional al tamaño: escalaMin -> volumenMin, escalaMax -> volumenMax
        volumenPara(escala) {
          const d = this.data;
          const k = (escala - d.escalaMin) / (d.escalaMax - d.escalaMin);
          return d.volumenMin + (d.volumenMax - d.volumenMin) * Math.min(1, Math.max(0, k));
        },

        porcentajeVolumen(escala) {
          return Math.round(this.volumenPara(escala) * 100);
        },

        textoTamano(escala) {
          return `Tamaño ${Math.round((escala / this.data.escalaBase) * 100)}% · 🔊 ${this.porcentajeVolumen(escala)}%`;
        },

        contextoAudio() {
          this.audio = this.audio || new (window.AudioContext || window.webkitAudioContext)();
          if (this.audio.state === "suspended") this.audio.resume();
          return this.audio;
        },

        asegurarMusica() {
          try {
            const ctx = this.contextoAudio();
            if (!this.cancion) {
              this.cancion = new Audio(this.data.musica);
              this.cancion.loop = true;
              this.cancion.addEventListener("error", () => this.avisar("No se pudo cargar la canción", "aviso"));
              // Con GainNode el volumen también funciona en iOS (audio.volume se ignora allí)
              this.ganancia = ctx.createGain();
              this.ganancia.gain.value = this.volumenPara(this.escala);
              ctx.createMediaElementSource(this.cancion).connect(this.ganancia).connect(ctx.destination);
            }
            if (!this.pausado && this.cancion.paused) this.cancion.play().catch(() => {});
          } catch (_) {
            /* sin audio: el resto de la experiencia sigue funcionando */
          }
        },

        alternarPausa() {
          this.pausado = !this.pausado;
          if (this.pausado) this.raizAnimada.pause();
          else this.raizAnimada.play();
          if (this.pausado) this.cancion?.pause();
          else this.asegurarMusica();
          this.actualizarUI();
          this.avisar(this.pausado ? "⏸ Pausado" : "▶ Reanudado", this.pausado ? "aviso" : "ok");
          this.pulso(this.pausado ? 50 : 25);
          this.beep(this.pausado ? 330 : 660);
        },

        escalarPaso(factor) {
          const objetivo = this.escala * factor;
          const limitado = Math.min(this.data.escalaMax, Math.max(this.data.escalaMin, objetivo));
          if (Math.abs(limitado - this.escala) < 1e-4) {
            this.avisar(factor > 1 ? "Tamaño máximo" : "Tamaño mínimo", "aviso");
            this.pulso([30, 40, 30]);
            this.beep(200);
            return;
          }
          this.animarEscala(limitado);
          this.avisar(this.textoTamano(limitado), "info");
          this.pulso(20);
          this.beep(factor > 1 ? 520 : 420);
        },

        // Escala directa (pellizco). Avisa una sola vez al tocar el límite.
        fijarEscala(valor, { vibrarEnLimite }) {
          const limitado = Math.min(this.data.escalaMax, Math.max(this.data.escalaMin, valor));
          const enLimite = limitado !== valor;
          if (enLimite && !this.avisoLimite) {
            this.avisoLimite = true;
            this.avisar(valor > limitado ? "Tamaño máximo" : "Tamaño mínimo", "aviso");
            if (vibrarEnLimite) this.pulso([30, 40, 30]);
          } else if (!enLimite) {
            this.avisoLimite = false;
          }
          this.aplicarEscala(limitado);
        },

        aplicarEscala(e) {
          this.escala = e;
          this.modelo.setAttribute("scale", `${e} ${e} ${e}`);
          if (this.ganancia) this.ganancia.gain.setTargetAtTime(this.volumenPara(e), this.audio.currentTime, 0.05);
          this.actualizarUI();
        },

        // Transición suave para los botones (independiente de la pausa de A-Frame)
        animarEscala(destino) {
          cancelAnimationFrame(this.tween);
          const desde = this.escala;
          const t0 = performance.now();
          const dur = 160;
          const paso = (ahora) => {
            const k = Math.min(1, (ahora - t0) / dur);
            this.aplicarEscala(desde + (destino - desde) * k);
            if (k < 1) this.tween = requestAnimationFrame(paso);
          };
          this.tween = requestAnimationFrame(paso);
        },

        actualizarUI() {
          this.chipPausa.textContent = this.pausado ? "⏸ Pausado" : "▶ En movimiento";
          this.chipPausa.dataset.estado = this.pausado ? "pausa" : "play";
          this.chipTamano.textContent = `${this.porcentaje()}% · 🔊 ${this.porcentajeVolumen(this.escala)}%`;
          this.chipMarcador.textContent = this.marcadorVisible ? "● Marcador" : "○ Buscando marcador…";
          this.chipMarcador.dataset.estado = this.marcadorVisible ? "ok" : "busca";
          this.btnPausa.textContent = this.pausado ? "▶" : "⏸";
          this.btnMenos.disabled = this.escala <= this.data.escalaMin + 1e-4;
          this.btnMas.disabled = this.escala >= this.data.escalaMax - 1e-4;
        },

        avisar(texto, tipo) {
          this.toast.textContent = texto;
          this.toast.dataset.tipo = tipo;
          this.toast.classList.add("visible");
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => this.toast.classList.remove("visible"), 1200);
        },

        pulso(patron) {
          if (navigator.vibrate) navigator.vibrate(patron); // no disponible en iOS Safari
        },

        beep(frecuencia) {
          try {
            const ctx = this.contextoAudio();
            const osc = ctx.createOscillator();
            const gan = ctx.createGain();
            osc.frequency.value = frecuencia;
            gan.gain.setValueAtTime(0.08, ctx.currentTime);
            gan.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
            osc.connect(gan).connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
          } catch (_) {
            /* sin audio: la retroalimentación visual sigue funcionando */
          }
        },
      });
    </script>

    <style>
      html, body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      #hud { position: fixed; inset: 0; z-index: 999; pointer-events: none; font-family: system-ui, sans-serif; color: #fff; }
      #estado { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
      .chip { background: rgba(0, 0, 0, 0.6); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
      #chip-pausa[data-estado="pausa"] { background: rgba(200, 120, 0, 0.85); }
      #chip-marcador[data-estado="ok"] { background: rgba(0, 140, 70, 0.85); }
      #toast { position: absolute; top: 28%; left: 50%; transform: translate(-50%, 10px); padding: 12px 22px; border-radius: 14px; font-size: 20px; font-weight: 600; background: rgba(0, 0, 0, 0.75); opacity: 0; transition: opacity 0.15s, transform 0.15s; white-space: nowrap; }
      #toast.visible { opacity: 1; transform: translate(-50%, 0); }
      #toast[data-tipo="ok"] { background: rgba(0, 140, 70, 0.9); }
      #toast[data-tipo="aviso"] { background: rgba(200, 120, 0, 0.92); }
      #controles { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 16px; pointer-events: auto; }
      #controles button { width: 64px; height: 64px; border-radius: 50%; border: 0; font-size: 28px; color: #fff; background: rgba(0, 0, 0, 0.65); touch-action: manipulation; }
      #controles button:active { transform: scale(0.92); background: rgba(0, 120, 255, 0.85); }
      #controles button:disabled { opacity: 0.35; }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden">
    <div id="hud">
      <div id="estado">
        <span class="chip" id="chip-marcador">○ Buscando marcador…</span>
        <span class="chip" id="chip-pausa">▶ En movimiento</span>
        <span class="chip" id="chip-tamano">100%</span>
      </div>
      <div id="toast"></div>
      <div id="controles">
        <button id="btn-menos" aria-label="Reducir">−</button>
        <button id="btn-pausa" aria-label="Pausa">⏸</button>
        <button id="btn-mas" aria-label="Aumentar">+</button>
      </div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets>
        <a-asset-item id="modelo" src="modelo.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="kanji">
        <!-- Eje X: balanceo (cabeceo) de -25° a 25° -->
        <a-entity
          id="balanceo"
          animation="property: rotation; from: -25 0 0; to: 25 0 0; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine"
        >
          <!-- Eje Y: giro completo sobre su propio eje -->
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
            <!-- Eje Z: va y viene hacia adelante y atrás -->
            <a-entity
              animation="property: position; from: 0 0 -0.4; to: 0 0 0.4; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"
            >
              <!-- Opacidad + cambio de color sobre los materiales del GLB -->
              <a-entity
                gltf-model="#modelo"
                efecto-material="opacidadMin: 0.3; duracionOpacidad: 2500; duracionColor: 6000"
                interaccion-tactil="escalaBase: 0.3; escalaMin: 0.1; escalaMax: 1.0"
                position="0 0 0"
                scale="0.3 0.3 0.3"
              ></a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
