<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Realidad Aumentada - A-Frame + AR.js</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js para A-Frame (marker-based AR) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
        font-family: sans-serif;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden">

    <a-scene
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets>
        <a-asset-item id="modelo" src="modelo.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="kanji">
        <!-- este contenedor gira, así el modelo da vueltas alrededor del marcador -->
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
        >
          <a-entity
            gltf-model="#modelo"
            position="0.5 0.3 0"
            scale="0.3 0.3 0.3"
          ></a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener("load", () => {
        const loader = document.querySelector(".arjs-loader");
        if (loader) loader.remove();
      });
    </script>
  </body>
</html>
