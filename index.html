<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Realidad Aumentada - A-Frame + WebXR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

    <link rel="stylesheet" href="css/estilos.css" />

    <!-- A-Frame (incluye WebXR y el componente ar-hit-test) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Código propio: el orden importa (config -> servicios -> componentes -> arranque) -->
    <script src="js/config.js"></script>
    <script src="js/servicios/audio.js"></script>
    <script src="js/servicios/retroalimentacion.js"></script>
    <script src="js/componentes/efecto-material.js"></script>
    <script src="js/componentes/ajustar-modelo.js"></script>
    <script src="js/componentes/colocar-en-superficie.js"></script>
    <script src="js/componentes/interaccion-tactil.js"></script>
    <script src="js/main.js"></script>
  </head>

  <body>
    <!-- Pantalla de inicio: entrar a AR requiere un toque del usuario -->
    <div id="inicio">
      <h1>Realidad aumentada</h1>
      <p id="inicio-mensaje">Apunta el celular a una mesa o al piso y coloca el modelo donde quieras.</p>
      <button id="btn-iniciar">Iniciar AR</button>
    </div>

    <!-- HUD: overlay que se ve dentro de la sesión AR -->
    <div id="hud" class="a-no-style">
      <div id="estado">
        <span class="chip" id="chip-superficie">○ Buscando superficie…</span>
        <span class="chip" id="chip-pausa">▶ En movimiento</span>
        <span class="chip" id="chip-tamano">100%</span>
      </div>
      <div id="toast"></div>
      <div id="pista"></div>
      <div id="controles">
        <button id="btn-menos" aria-label="Reducir" disabled>−</button>
        <button id="btn-pausa" aria-label="Pausa" disabled>⏸</button>
        <button id="btn-mas" aria-label="Aumentar" disabled>+</button>
        <button id="btn-reubicar" aria-label="Mover a otro lugar" disabled>📍</button>
      </div>
    </div>

    <a-scene
      xr-mode-ui="enabled: false"
      webxr="requiredFeatures: hit-test; optionalFeatures: local-floor, anchors, dom-overlay; overlayElement: #hud"
      ar-hit-test="target: #objeto; type: map"
      colocar-en-superficie="target: #objeto"
    >
      <a-assets>
        <a-asset-item id="modelo" src="assets/modelo.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.9"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>

      <!-- Raíz colocada sobre la superficie: ar-hit-test la mueve y la ancla al mundo real -->
      <a-entity id="objeto" visible="false">
        <!-- Eje X: balanceo (cabeceo) de -25° a 25° -->
        <a-entity
          id="balanceo"
          animation="property: rotation; from: -25 0 0; to: 25 0 0; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine"
        >
          <!-- Eje Y: giro completo sobre su propio eje -->
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
            <!-- Eje Z: va y viene hacia adelante y atrás (en metros) -->
            <a-entity
              animation="property: position; from: 0 0 -0.15; to: 0 0 0.15; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"
            >
              <!-- Modelo: tamaño real, opacidad + color animados, gestos táctiles -->
              <a-entity
                gltf-model="#modelo"
                ajustar-modelo
                efecto-material
                interaccion-tactil="raizAnimada: #balanceo"
              ></a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
